name: Actualizar dashboard

on:
  schedule:
    # Cada 6 horas. Los horarios de cron de GitHub Actions son en UTC.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Evita que dos corridas (ej. el cron y un disparo manual al mismo tiempo)
# hagan push en paralelo y se pisen.
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Garmin es obligatorio: si falla, este paso termina con exit code
      # distinto de cero y el Action queda en rojo (visible), sin tocar
      # data.json/dashboard.html. TrainingPeaks ya no se trae aqui -- el
      # plan se actualiza a mano via Chrome/Cowork (la integracion
      # automatica no es confiable, falla con 401) -- --skip-trainingpeaks
      # evita que lo intente y reusa directamente el plan del ultimo
      # data.json commiteado -- ver fetch_data.py y README.md.
      - name: Traer datos (Garmin)
        env:
          GARMIN_USER: ${{ secrets.GARMIN_USER }}
          GARMIN_PASS: ${{ secrets.GARMIN_PASS }}
        run: python fetch_data.py --skip-trainingpeaks

      # NOTA: --race-date/--goal-time deben actualizarse aqui (y en el
      # objetivo del brief) despues del maraton del 27-sep-2026 si cambia
      # el objetivo -- ver seccion 6 de entrenador-virtual-maraton.md.
      - name: Combinar datos (build_data.py)
        run: >
          python build_data.py
          --trainingpeaks live/trainingpeaks.csv
          --garmin live/garmin.csv
          --garmin-activities live/garmin_activities.json
          --race-date 2026-09-27
          --goal-time 3:40:00
          --out data.json

      - name: Generar dashboard (render_html.py)
        run: python render_html.py --data data.json --out dashboard.html

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json dashboard.html
          if git diff --cached --quiet; then
            echo "Sin cambios, no se hace commit."
          else
            git commit -m "Actualiza datos automaticamente ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
